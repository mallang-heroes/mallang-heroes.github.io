<!DOCTYPE html>
<html lang="ko">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="말랑영웅전 — 한국 위인 랜덤 디펜스">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="말랑영웅전">
  <meta name="theme-color" content="#3E4A2E">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>말랑영웅전</title>
  <style>html, body { margin: 0; height: 100%; background: #3E4A2E; overscroll-behavior: none; }</style>
</head>
<body>
  <!-- 로딩 화면: art/tools/web/make_loader.py 로 생성 -->
  <style>
    @font-face{font-family:'GowunBatangL';src:url('assets/assets/fonts/GowunBatang-Bold.ttf') format('truetype');font-weight:700;font-display:swap}
    #ml-loader{position:fixed;inset:0;z-index:10;background:#2c3720 url('loader-bg.jpg') center/cover no-repeat;overflow:hidden;transition:opacity .45s ease}
    #ml-loader.done{opacity:0;pointer-events:none}
    #ml-stage{position:absolute;left:50%;top:50%;width:1560px;height:720px;transform-origin:0 0}
    #ml-title{position:absolute;left:0;right:0;top:190px;text-align:center;font:700 96px 'GowunBatangL',serif;color:#FBF8F1;text-shadow:4px 4px 0 rgba(0,0,0,.43)}
    #ml-bar{position:absolute;left:330px;top:520px;width:900px;height:26px;border-radius:13px;background:#4E463A;box-shadow:0 0 0 4px #2A211C}
    #ml-fill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:13px;background:linear-gradient(#F8D680 0 50%,#F2C14E 50%);transition:width .35s ease}
    #ml-run{position:absolute;left:330px;top:520px;width:0;height:0;transition:left .35s ease}
    #ml-run>div{position:absolute}
    #ml-msg{position:absolute;left:0;right:0;top:572px;text-align:center;font:400 26px system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#FBF8F1}
    .hop{animation:hop .42s ease-in-out infinite alternate}
    .flee{animation:hop .3s ease-in-out infinite alternate}
    .float{animation:float 1.1s ease-in-out infinite alternate}
    @keyframes hop{from{transform:translateY(0)}to{transform:translateY(-8px)}}
    @keyframes float{from{transform:translateY(-2px)}to{transform:translateY(-12px)}}
    .bang{position:absolute;left:50%;top:-30px;font:700 28px system-ui,sans-serif;color:#E0483E;animation:blink .5s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    .s0{width:63.2px;height:75.6px;background:url('assets/assets/images/units/spear/gunjol/unit-spear-gunjol-walk.webp') 0 0/252.8px 75.6px no-repeat;animation:s0-a 0.4s steps(4) infinite}@keyframes s0-a{to{background-position-x:-252.8px}}.s1{width:62.0px;height:75.6px;background:url('assets/assets/images/units/archer/gunjol/unit-archer-gunjol-walk.webp') 0 0/248.0px 75.6px no-repeat;animation:s1-a 0.4s steps(4) infinite}@keyframes s1-a{to{background-position-x:-248.0px}}.s2{width:63.2px;height:75.6px;background:url('assets/assets/images/units/gunner/gunjol/unit-gunner-gunjol-walk.webp') 0 0/252.8px 75.6px no-repeat;animation:s2-a 0.4s steps(4) infinite}@keyframes s2-a{to{background-position-x:-252.8px}}.s3{width:88.0px;height:100.4px;background:url('assets/assets/images/units/cavalry/gunjol/unit-cavalry-gunjol-walk.webp') 0 0/352.0px 100.4px no-repeat;animation:s3-a 0.4s steps(4) infinite}@keyframes s3-a{to{background-position-x:-352.0px}}.s4{width:78.1px;height:81.8px;background:url('assets/assets/images/units/navy/gunjol/unit-navy-gunjol-walk.webp') 0 0/312.4px 81.8px no-repeat;animation:s4-a 0.4s steps(4) infinite}@keyframes s4-a{to{background-position-x:-312.4px}}.s5{width:65.7px;height:101.7px;background:url('assets/assets/images/units/mystic/gunjol/unit-mystic-gunjol-walk.webp') 0 0/262.8px 101.7px no-repeat;animation:s5-a 0.4s steps(4) infinite}@keyframes s5-a{to{background-position-x:-262.8px}}.m0{width:72.8px;height:58.6px;background:url('assets/assets/images/monsters/mob-boar/mob-boar-walk.webp') 0 0/436.8px 58.6px no-repeat;animation:m0-a 0.6s steps(6) infinite}@keyframes m0-a{to{background-position-x:-436.8px}}.m1{width:101.3px;height:97.9px;background:url('assets/assets/images/monsters/mob-gumiho/mob-gumiho-walk.webp') 0 0/607.8px 97.9px no-repeat;animation:m1-a 0.6s steps(6) infinite}@keyframes m1-a{to{background-position-x:-607.8px}}.m2{width:61.9px;height:84.5px;background:url('assets/assets/images/monsters/mob-ghost/mob-ghost-walk.webp') 0 0/371.4px 84.5px no-repeat;animation:m2-a 0.6s steps(6) infinite}@keyframes m2-a{to{background-position-x:-371.4px}}
  </style>
  <div id="ml-loader" aria-live="polite">
    <div id="ml-stage">
      <div id="ml-title">말랑영웅전</div>
      <div id="ml-bar"><div id="ml-fill"></div></div>
      <div id="ml-run">
        <div class="hop" style="left:-45.4px;top:-72.4px;animation-delay:-0.00s"><div class="s0"></div></div><div class="hop" style="left:-106.1px;top:-72.4px;animation-delay:-0.13s"><div class="s1"></div></div><div class="hop" style="left:-169.6px;top:-72.4px;animation-delay:-0.26s"><div class="s2"></div></div><div class="hop" style="left:-236.4px;top:-96.9px;animation-delay:-0.39s"><div class="s3"></div></div><div class="hop" style="left:-302.2px;top:-78.1px;animation-delay:-0.52s"><div class="s4"></div></div><div class="hop" style="left:-349.5px;top:-98.0px;animation-delay:-0.65s"><div class="s5"></div></div><div class="flee" style="left:109.5px;top:-56.4px;animation-delay:-0.00s"><b class="bang">!</b><div class="m0"></div></div><div class="flee" style="left:181.6px;top:-95.8px;animation-delay:-0.21s"><div class="m1"></div></div><div class="float" style="left:301.6px;top:-80.9px;animation-delay:-0.42s"><div class="m2"></div></div>
      </div>
      <div id="ml-msg">게임 엔진 불러오는 중…</div>
    </div>
  </div>
  <script>
    (function () {
      var stage = document.getElementById('ml-stage');
      function fit() {
        var k = Math.min(innerWidth / 1560, innerHeight / 720);
        stage.style.transform = 'scale(' + k + ') translate(-50%,-50%)';
      }
      fit(); addEventListener('resize', fit);
      var shown = 0, fake = 0, real = -1, finished = false;
      function draw(p) {
        shown = Math.max(shown, p);
        document.getElementById('ml-fill').style.width = (shown * 100) + '%';
        document.getElementById('ml-run').style.left = (330 + 900 * shown) + 'px';
        document.getElementById('ml-msg').textContent =
          (real < 0 ? '게임 엔진 불러오는 중… ' : '그림 불러오는 중… ') + Math.round(shown * 100) + '%';
      }
      // 엔진을 받는 동안: 0 → 45%까지 천천히 (실제 진행률은 알 수 없어서 시간으로 채움)
      var t = setInterval(function () {
        if (real >= 0 || finished) return clearInterval(t);
        fake += (0.45 - fake) * 0.04; draw(fake);
      }, 100);
      draw(0.02);
      // 게임(Dart)이 그림 진행률을 알려 준다: 45% → 100%
      window.mallangLoader = {
        progress: function (p) {
          real = p; draw(0.45 + 0.55 * p);
          if (p >= 1 && !finished) {
            finished = true;
            setTimeout(function () {
              var el = document.getElementById('ml-loader');
              el.classList.add('done');
              setTimeout(function () { el.remove(); }, 600);
            }, 250);
          }
        }
      };
    })();
  </script>
  <!-- /로딩 화면 -->
  <script>
    // 예전 버전이 등록한 서비스 워커·캐시 정리 (새 버전이 바로 보이게)
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (rs) { rs.forEach(function (r) { r.unregister(); }); });
    }
    if (window.caches) {
      caches.keys().then(function (ks) { ks.forEach(function (k) { caches.delete(k); }); });
    }
  </script>
  <script src="flutter_bootstrap.js?v=__BUILD__" async></script>
</body>
</html>
