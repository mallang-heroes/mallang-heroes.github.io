<!DOCTYPE html>
<html lang="ko">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="말랑영웅전 — 한국 위인 랜덤 디펜스">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="말랑영웅전">
  <meta name="theme-color" content="#3E4A2E">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>말랑영웅전</title>
  <style>html, body { margin: 0; height: 100%; background: #3E4A2E; overscroll-behavior: none; }</style>
</head>
<body>
  <script>
    // 예전 버전이 등록한 서비스 워커·캐시 정리 (새 버전이 바로 보이게)
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (rs) { rs.forEach(function (r) { r.unregister(); }); });
    }
    if (window.caches) {
      caches.keys().then(function (ks) { ks.forEach(function (k) { caches.delete(k); }); });
    }
  </script>
  <script src="flutter_bootstrap.js?v=__BUILD__" async></script>
</body>
</html>
