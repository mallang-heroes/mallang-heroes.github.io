name: mallang_heroes
description: 말랑영웅전 — 한국 위인 랜덤 디펜스
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flame: ^1.18.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/images/map/
    - assets/images/units/spear/gunjol/
    - assets/images/units/spear/jeongbyeong/
    - assets/images/units/spear/gungwan/
    - assets/images/units/spear/jangsu/
    - assets/images/units/archer/gunjol/
    - assets/images/units/archer/jeongbyeong/
    - assets/images/units/archer/gungwan/
    - assets/images/units/archer/jangsu/
    - assets/images/units/gunner/gunjol/
    - assets/images/units/gunner/jeongbyeong/
    - assets/images/units/gunner/gungwan/
    - assets/images/units/gunner/jangsu/
    - assets/images/monsters/mob-boar/
    - assets/images/monsters/boss-boar/
    - assets/images/monsters/mob-tiger/
    - assets/images/monsters/boss-tiger/
    - assets/images/monsters/mob-gumiho/
    - assets/images/monsters/boss-gumiho/
    - assets/images/monsters/mob-dokkaebi/
    - assets/images/monsters/boss-dokkaebi/
    - assets/images/monsters/mob-ghost/
    - assets/images/monsters/boss-ghost/
    - assets/images/monsters/mob-zombie/
    - assets/images/monsters/boss-zombie-king/
  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Regular.otf
          weight: 400
        - asset: assets/fonts/Pretendard-Bold.otf
          weight: 700
    - family: GowunBatang
      fonts:
        - asset: assets/fonts/GowunBatang-Bold.ttf
          weight: 700
