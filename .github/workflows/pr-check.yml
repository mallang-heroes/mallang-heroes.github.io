name: PR Check

# PR마다 분석 + 웹 빌드만 확인한다 (배포 안 함, main 배포와 서로 취소하지 않음).
on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-check-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create platform folders
        run: |
          flutter create . --project-name mallang_heroes --org com.osangplay --platforms web
          rm -rf test
      - run: flutter pub get
      - name: Analyze
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings > analyze.txt 2>&1 || true
          cat analyze.txt
          if grep -qE "^ *error" analyze.txt; then
            grep -E "^ *error" analyze.txt | head -40 | while read -r line; do echo "::error::$line"; done
            exit 1
          fi
      - name: Build web
        run: flutter build web --release --base-href /
