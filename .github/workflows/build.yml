name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create platform folders (android, web icons)
        run: |
          flutter create . --project-name mallang_heroes --org com.osangplay --platforms web,android
          rm -rf test

      - run: flutter pub get

      # 에러를 GitHub 화면(Annotations)에 바로 보이게 남긴다.
      - name: Analyze
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings > analyze.txt 2>&1 || true
          cat analyze.txt
          grep -E "^ *error" analyze.txt | head -40 | while read -r line; do echo "::error::$line"; done

      - name: Build web
        run: |
          set -o pipefail
          flutter build web --release --base-href / 2>&1 | tee web.txt || {
            grep -E "Error|error:" web.txt | head -40 | while read -r line; do echo "::error::$line"; done
            exit 1
          }

      - name: Build Android APK
        continue-on-error: true
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee apk.txt || {
            grep -E "Error|error:|FAILURE|What went wrong" -A2 apk.txt | head -40 | while read -r line; do echo "::error::$line"; done
            exit 1
          }
          cp build/app/outputs/flutter-apk/app-release.apk build/web/mallang-heroes.apk

      - uses: actions/upload-artifact@v4
        with:
          name: mallang-heroes-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: warn

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
